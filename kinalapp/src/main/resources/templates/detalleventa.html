<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Venta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}">Clientes</a>
            <a th:href="@{/usuarios-view}">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}">Ventas</a>
            <a th:href="@{/detalleventa-view}" class="active">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Detalle Venta</h1>

            <form class="form-grid" id="detalleVentaForm">
                <input type="number" id="codigoDetalleVenta" placeholder="Código Detalle Venta" required>
                <input type="number" id="cantidadDetalle" placeholder="Cantidad" required>
                <input type="number" step="0.01" id="precioUnitarioDetalle" placeholder="Precio Unitario" required>
                <input type="number" step="0.01" id="subtotalDetalle" placeholder="Subtotal" required>
                <input type="number" id="codigoProductoDetalle" placeholder="Código Producto" required>
                <input type="number" id="codigoVentaDetalle" placeholder="Código Venta" required>
                <button type="submit" id="btnGuardarDetalleVenta">Guardar Detalle</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar Detalle por Código</h2>
            <div class="form-grid">
                <input type="number" id="buscarCodigoDetalleVenta" placeholder="Ingrese código a buscar">
                <button type="button" id="btnBuscarDetalleVenta">Buscar Detalle</button>
            </div>
        </section>

        <section class="card">
            <h2>Listado de Detalle Venta</h2>
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                    <th>Código Producto</th>
                    <th>Código Venta</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaDetalleVenta"></tbody>
            </table>
        </section>
    </main>
</div>

<script th:src="@{/js/detalleventa.js}"></script>
</body>
</html>
