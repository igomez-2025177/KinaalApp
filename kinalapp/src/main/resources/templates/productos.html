<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}">Clientes</a>
            <a th:href="@{/usuarios-view}">Usuarios</a>
            <a th:href="@{/productos-view}" class="active">Productos</a>
            <a th:href="@{/ventas-view}">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Productos</h1>

            <form class="form-grid" id="productoForm">
                <input type="number" id="codigoProducto" placeholder="Código Producto" required>
                <input type="text" id="nombreProducto" placeholder="Nombre Producto" required>
                <input type="number" step="0.01" id="precioProducto" placeholder="Precio" required>
                <input type="number" id="stockProducto" placeholder="Stock" required>
                <input type="number" id="estadoProducto" placeholder="Estado" required>
                <button type="submit" id="btnGuardarProducto">Guardar Producto</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar Producto por Código</h2>
            <div class="form-grid">
                <input type="number" id="buscarCodigoProducto" placeholder="Ingrese código a buscar">
                <button type="button" id="btnBuscarProducto">Buscar Producto</button>
            </div>
        </section>

        <section class="card">
            <h2>Listado de Productos</h2>
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </section>
    </main>
</div>

<script th:src="@{/js/productos.js}"></script>
</body>
</html>
