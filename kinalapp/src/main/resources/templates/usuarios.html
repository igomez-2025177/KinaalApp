<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}">Clientes</a>
            <a th:href="@{/usuarios-view}" class="active">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Usuarios</h1>

            <form class="form-grid">
                <input type="number" placeholder="Código Usuario">
                <input type="text" placeholder="Username">
                <input type="password" placeholder="Password">
                <input type="email" placeholder="Email">
                <input type="text" placeholder="Rol">
                <input type="number" placeholder="Estado">
                <button type="submit">Guardar Usuario</button>
            </form>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
