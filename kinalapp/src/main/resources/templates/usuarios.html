<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}">Clientes</a>
            <a th:href="@{/usuarios-view}" class="active">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Usuarios</h1>

            <form class="form-grid" id="usuarioForm">
                <input type="number" id="codigoUsuario" placeholder="Código Usuario" required>
                <input type="text" id="usernameUsuario" placeholder="Username" required>
                <input type="password" id="passwordUsuario" placeholder="Password" required>
                <input type="email" id="emailUsuario" placeholder="Email" required>
                <input type="text" id="rolUsuario" placeholder="Rol" required>
                <input type="number" id="estadoUsuario" placeholder="Estado" required>
                <button type="submit" id="btnGuardarUsuario">Guardar Usuario</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar Usuario por Código</h2>
            <div class="form-grid">
                <input type="number" id="buscarCodigoUsuario" placeholder="Ingrese código a buscar">
                <button type="button" id="btnBuscarUsuario">Buscar Usuario</button>
            </div>
        </section>

        <section class="card">
            <h2>Listado de Usuarios</h2>
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </section>
    </main>
</div>

<script th:src="@{/js/usuarios.js}"></script>
</body>
</html>
