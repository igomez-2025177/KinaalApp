<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}" class="active">Clientes</a>
            <a th:href="@{/usuarios-view}">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Clientes</h1>

            <form class="form-grid" id="clienteForm">
                <input type="text" id="dpiCliente" placeholder="DPI Cliente" required>
                <input type="text" id="nombreCliente" placeholder="Nombre Cliente" required>
                <input type="text" id="apellidoCliente" placeholder="Apellido Cliente" required>
                <input type="text" id="direccionCliente" placeholder="Dirección" required>
                <input type="number" id="estadoCliente" placeholder="Estado" required>
                <button type="submit" id="btnGuardarCliente">Guardar Cliente</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar Cliente por DPI</h2>
            <div class="form-grid">
                <input type="text" id="buscarDpiCliente" placeholder="Ingrese DPI a buscar">
                <button type="button" id="btnBuscarCliente">Buscar Cliente</button>
            </div>
        </section>

        <section class="card">
            <h2>Listado de Clientes</h2>
            <table>
                <thead>
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaClientes"></tbody>
            </table>
        </section>
    </main>
</div>

<script th:src="@{/js/clientes.js}"></script>
</body>
</html>
