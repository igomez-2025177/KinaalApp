<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}" class="active">Clientes</a>
            <a th:href="@{/usuarios-view}">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Clientes</h1>

            <form class="form-grid">
                <input type="text" placeholder="DPI Cliente">
                <input type="text" placeholder="Nombre Cliente">
                <input type="text" placeholder="Apellido Cliente">
                <input type="text" placeholder="Dirección">
                <input type="number" placeholder="Estado">
                <button type="submit">Guardar Cliente</button>
            </form>
        </section>

        <section class="card">
            <h2>Listado de Clientes</h2>
            <table>
                <thead>
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>1234567890101</td>
                    <td>Isai</td>
                    <td>Gómez</td>
                    <td>Guatemala</td>
                    <td>1</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
