<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}">Clientes</a>
            <a th:href="@{/usuarios-view}">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}" class="active">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Ventas</h1>

            <form class="form-grid">
                <input type="number" placeholder="Código Venta">
                <input type="date" placeholder="Fecha Venta">
                <input type="number" step="0.01" placeholder="Total">
                <input type="number" placeholder="Estado">
                <input type="text" placeholder="DPI Cliente">
                <input type="number" placeholder="Código Usuario">
                <button type="submit">Guardar Venta</button>
            </form>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>s
