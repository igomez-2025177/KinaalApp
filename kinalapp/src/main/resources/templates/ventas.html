<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h2>KinalApp</h2>
        <nav>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/clientes-view}">Clientes</a>
            <a th:href="@{/usuarios-view}">Usuarios</a>
            <a th:href="@{/productos-view}">Productos</a>
            <a th:href="@{/ventas-view}" class="active">Ventas</a>
            <a th:href="@{/detalleventa-view}">Detalle Venta</a>
        </nav>
    </aside>

    <main class="content">
        <section class="card">
            <h1>Ventas</h1>

            <form class="form-grid" id="ventaForm">
                <input type="number" id="codigoVenta" placeholder="Código Venta" required>
                <input type="date" id="fechaVenta" required>
                <input type="number" step="0.01" id="totalVenta" placeholder="Total" required>
                <input type="number" id="estadoVenta" placeholder="Estado" required>
                <input type="text" id="dpiClienteVenta" placeholder="DPI Cliente" required>
                <input type="number" id="codigoUsuarioVenta" placeholder="Código Usuario" required>
                <button type="submit" id="btnGuardarVenta">Guardar Venta</button>
            </form>
        </section>

        <section class="card">
            <h2>Buscar Venta por Código</h2>
            <div class="form-grid">
                <input type="number" id="buscarCodigoVenta" placeholder="Ingrese código a buscar">
                <button type="button" id="btnBuscarVenta">Buscar Venta</button>
            </div>
        </section>

        <section class="card">
            <h2>Listado de Ventas</h2>
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>DPI Cliente</th>
                    <th>Código Usuario</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tablaVentas"></tbody>
            </table>
        </section>
    </main>
</div>

<script th:src="@{/js/ventas.js}"></script>
</body>
</html>
