<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="/css/styles.css" th:href="@{/css/styles.css}">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <section class="auth-card">
        <h1>Crear Cuenta</h1>

        <form class="auth-form" id="registroForm">
            <div class="auth-input-group">
                <span class="auth-icon mail-icon"></span>
                <input type="email" id="emailUsuario" placeholder="Correo electrónico" required>
            </div>

            <div class="auth-input-group">
                <span class="auth-icon user-icon"></span>
                <input type="text" id="usernameUsuario" placeholder="Nombre de usuario" required>
            </div>

            <div class="auth-input-group">
                <span class="auth-icon lock-icon"></span>
                <input type="password" id="passwordUsuario" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="auth-btn">REGISTRARME</button>
        </form>

        <p class="auth-link-text">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </p>
    </section>
</div>

<script th:src="@{/js/registro.js}"></script>
</body>
</html>
